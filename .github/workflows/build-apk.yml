# Opcjonalne: buduje APK w chmurze GitHub (bez Android Studio i bez laptopa).
# Użycie: wgraj projekt do repozytorium na GitHub -> zakładka Actions -> "Build APK" -> Run workflow.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Testy jednostkowe (niewymagane do zbudowania APK)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
      - name: Budowanie APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agent-telefonu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          