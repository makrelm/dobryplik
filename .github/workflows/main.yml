name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install command-line Android SDK tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk
          curl -sS -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q cmdline.zip -d cmdline-tools
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/ || true
          # Zainstaluj platformę odpowiadającą compileSdk = 35
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          # zaakceptuj licencje
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true

      - name: Export Android SDK env vars
        run: |
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $HOME/android-sdk
          cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --list || true
          ls -la $HOME/android-sdk/platforms || true

      - name: Set up Gradle 8.9
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.9'

      - name: Resolve dependencies (debug) and save output
        run: |
          mkdir -p logs
          gradle :app:dependencies --configuration debugCompileClasspath --no-daemon --stacktrace --info 2>&1 | tee logs/deps.log || true
        continue-on-error: true

      - name: Upload deps log
        uses: actions/upload-artifact@v4
        with:
          name: deps-log
          path: logs/deps.log

      - name: Build Debug APK (with debug logging)
        run: |
          mkdir -p logs
          gradle :app:assembleDebug --no-daemon --stacktrace --debug 2>&1 | tee logs/gradle-output.log
        continue-on-error: false

      - name: Upload gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: logs/gradle-output.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
